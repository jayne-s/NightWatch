services:
  media:
    build: ./services/media
    ports:
      - "8001:8001"
    environment:
      MEDIA_DATABASE_URL: sqlite:////data/media.db
      VIEWER_DATABASE_URL: sqlite:////data/viewers.db
    volumes:
      - shared_data:/data

  viewers:
    build: ./services/viewers
    ports:
      - "8002:8002"
    environment:
      VIEWER_DATABASE_URL: sqlite:////data/viewers.db
    volumes:
      - shared_data:/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_MEDIA_API_URL: http://localhost:8001
      VITE_VIEWER_API_URL: http://localhost:8002

volumes:
  shared_data:
